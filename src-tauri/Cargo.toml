[package]
name = "lunarshroud"
version = "0.9.0-beta.2"
description = "LunarShroud - llama.cpp 桌面端启动器"
authors = ["LunarShroud contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "lunarshroud_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
getrandom = "0.2"
# 就绪探测的挑战-应答：后端以 HMAC-SHA256(token, nonce) 证明自己持有令牌，
# 令牌本身从不出现在探测请求/响应里。ring 已在依赖锁的传递闭包里（rustls），
# 直接复用它的 HMAC 实现，不自己拼密码学原语。
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
