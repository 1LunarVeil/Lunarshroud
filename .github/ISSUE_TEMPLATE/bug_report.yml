name: Bug report
description: Report a reproducible LunarShroud problem
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private model paths, or other secrets.
  - type: input
    id: version
    attributes: {label: LunarShroud version}
    validations: {required: true}
  - type: input
    id: windows
    attributes: {label: Windows version}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior and redacted logs}
    validations: {required: true}
