name: Build release candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Fixed metadata: consecutive PyInstaller builds otherwise embed
      # different timestamps/hash iteration order. The NSIS installer itself
      # is still not byte-reproducible; its inner binaries are.
      SOURCE_DATE_EPOCH: '1790000000'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Release mirror gate
        # 发布路径上的最后一道门：镜像漂移或带本机痕迹时不许出产物。
        # 放在构建之前 —— 门禁失败就不该有 artifact 可供上传。
        # 公开仓库本身没有 github/，此时无事可比（脚本放行）；跳过而不是假绿。
        if: hashFiles('github/**') != ''
        run: python -X utf8 tools/check_release_mirror.py
      - name: Install and test Python backend
        # 哈希锁安装（审计 F21），见 ci.yml 同名步骤的说明。
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pytest --cov=backend --cov-config=.coveragerc --cov-fail-under=75
      - name: Lint backend and tools (ruff)
        # 发布路径不能只跑 pytest：lint 与前端/Rust 门禁在 ci.yml 里有，但打 tag
        # 时可能没有对应的 push CI。发布作业必须自己把同一套门禁再跑一遍。
        run: python -m ruff check backend tools
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'
      - name: Frontend unit tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem frontend/tests -File -Filter '*.test.mjs')
          if ($tests.Count -eq 0) { throw 'No frontend test files found; refusing a false-green check.' }
          node --test $tests.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Ran $($tests.Count) frontend test file(s)."
      - name: Frontend syntax check
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem frontend/js -File | Where-Object Extension -in '.js', '.mjs')
          if ($scripts.Count -eq 0) { throw 'No JavaScript files found; refusing a false-green check.' }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Python backend
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean -y
      - name: Install pinned Rust and Tauri CLI
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          cargo +1.97.1 install tauri-cli --version 2.11.4 --locked
      - name: Rust formatting, lint and tests
        run: |
          cargo +1.97.1 fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo +1.97.1 clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings -A linker-messages
          cargo +1.97.1 test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build NSIS installer
        working-directory: src-tauri
        shell: pwsh
        run: |
          # Registry crate paths (which contain the build machine's user name)
          # end up in panic location strings inside the binary. Remap them to a
          # neutral prefix so the public artifact carries no builder identity.
          $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE\.cargo\registry\src=cargo-registry"
          cargo +1.97.1 tauri build --ci -- --locked
      - name: Create checksums
        shell: pwsh
        run: |
          # 只对本次构建的安装包计算校验和：目录里可能残留上一次的
          # SHA256SUMS.txt 或调试文件，把"目录里的一切"算进去会把它们带上发布。
          $artifacts = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*.exe')
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($artifacts.Count)."
          }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lunarshroud-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  # ── 把安装包真正发布出去 ──────────────────────────────────────────────
  # 只 upload-artifact 等于没有发布：workflow artifact 90 天过期、必须登录
  # GitHub 点进具体某次运行才能下载、仓库首页完全没有入口。要满足"给不懂
  # 命令行的用户一个能直接装的文件"，必须落到 GitHub Release 上。
  #
  # 单独成 job 有两个理由：
  #   1) 构建 job 的 permissions 保持 contents: read（最小权限不被稀释），
  #      写权限只给这个真正需要它的 job；
  #   2) 只在打 tag 时运行 —— workflow_dispatch 试跑不会误发一个公开版本。
  #
  # 刻意用 runner 自带的 gh CLI，而不是引入第三方 action：本仓库的既有约定是
  # 所有 action 固定到完整 commit SHA 且只用官方 actions/*，为一步发布破例
  # 不划算。
  publish-release:
    needs: windows-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 写权限只给这一个 job（构建 job 保持 read）；actions: read 是为了 gh run download
    permissions:
      contents: write
      actions: read
    steps:
      # 用 runner 自带的 gh CLI 取回上游 job 的 artifact，刻意不引入
      # actions/download-artifact：本仓库的约定是所有 action 固定到完整 40 位
      # commit SHA 且优先官方 actions/*，为一步搬运新增一个待核实的固定值不划算。
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n "lunarshroud-windows-$GITHUB_REF_NAME" -D dist/
          ls -l dist/
      - name: Refuse to publish an incomplete bundle
        shell: bash
        run: |
          shopt -s nullglob
          installers=(dist/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "期望恰好 1 个安装包，实际 ${#installers[@]}: ${installers[*]}" >&2
            exit 1
          fi
          if [ ! -s dist/SHA256SUMS.txt ]; then
            echo "SHA256SUMS.txt 缺失或为空，用户将无从校验" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # 校验信息直接写进 Release 正文：未签名的包里，这是用户唯一能自主
          # 验证"我下的这个确实是官方构建"的手段，不能只留在 artifact 里。
          {
            echo ""
            echo "## 完整性校验"
            echo ""
            echo "下载后请先核对哈希（PowerShell）："
            echo ""
            echo '```powershell'
            for f in dist/*.exe; do
              b=$(basename "$f")
              echo "(Get-FileHash -Algorithm SHA256 '$b').Hash.ToLower()   # 应为: $(awk -v n="$b" '$2==n{print $1}' dist/SHA256SUMS.txt)"
            done
            echo '```'
            echo ""
            echo "⚠️ 本构建未做代码签名，Windows SmartScreen 可能提示未知发布者。"
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
