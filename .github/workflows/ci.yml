name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Release mirror gate
        # 公开镜像 github/ 与工作树必须逐字节一致，且不得携带本机痕迹。
        # 这条门禁此前只能手工跑：镜像漂移与隐私泄露都不会被 CI 发现（审计已实证，
        # 仓库根目录的 .lnk 就是这样进到"可发布"名单里的）。纯标准库，无依赖，
        # 所以放在安装依赖之前，最快失败。
        # 公开仓库本身没有 github/ 子目录（它就是镜像），此时脚本无事可比；
        # 用 if 跳过，而不是在 Actions 里展示一个永远绿的空步骤。
        if: hashFiles('github/**') != ''
        run: python -X utf8 tools/check_release_mirror.py
      - name: Install Python dependencies
        # 哈希锁安装（审计 F21）：requirements-dev.lock 钉住完整闭包并对每个
        # 产物给出 sha256（cp311 本地 / cp312 CI 两套 win_amd64 wheel）；哈希已
        # 对 PyPI 官方 JSON 摘要交叉验证。保险库文件的重新生成说明见其头注释。
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Lint backend and tools (ruff)
        # tools/ 一并 lint：它们也随仓库发布，只 lint backend 会让工具脚本的
        # 问题长期不进 CI，而某份历史记录里的 "lint clean" 容易被读成全仓干净。
        # 公开镜像 github/ 不必单独 lint —— 镜像门禁已强制它与工作树逐字节
        # 一致，working tree 侧过了就等于过了。
        run: python -m ruff check backend tools
      # 前端必须在后端测试**之前**构建。
      #
      # `register_static_ui` 只在 `ui/dist/index.html` 存在时挂载 `/`，而
      # `test_regressions.py::test_document_responses_are_not_framable` 与
      # `test_auth_coverage.py` 的穷举都要请求 `/`。2026-11-25 实测：CI 先跑
      # pytest 则 `ui/dist` 不存在，`/` 返回 500，两条测试一起红；而在开发机上
      # 前端早就构建过，本地全绿。这就是 AGENTS §2.35 说的"开发机进不去的状态"。
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'
      - name: Install UI dependencies
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed in ui/.' }
      - name: UI production build (needed by backend tests)
        working-directory: ui
        shell: pwsh
        run: |
          # The build output is what Tauri embeds and what the backend serves in
          # the source-run channel, and it is a precondition for the backend's
          # document-response tests.
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed.' }
      - name: Backend tests and product-code coverage
        run: python -m pytest --cov=backend --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=75
      - name: UI typecheck
        working-directory: ui
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript typecheck failed.' }
      - name: UI unit tests
        working-directory: ui
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'UI unit tests failed.' }
      - name: UI production build gate
        working-directory: ui
        shell: pwsh
        run: |
          # The build already ran above (the backend's document tests need it).
          # This step keeps the original gate's meaning — a tree that passes unit
          # tests but bundles to nothing is not a usable artifact — without paying
          # for a second Vite run.
          if (-not (Test-Path dist/index.html)) { throw 'ui/dist/index.html is missing after build.' }
          if (-not (Test-Path dist/assets)) { throw 'ui/dist/assets is missing after build.' }
      - name: Browser core-path, accessibility and performance gate
        shell: pwsh
        run: |
          $env:LUNARSHROUD_ALLOW_INSECURE_DEV = '1'
          # 端口必须与 `--port` 一致：`trusted_origins()` 按**配置里的**
          # launcher_port 派生 WebSocket 信任表（AGENTS §2.7），两者不一致时
          # HTTP 正常但每个 WebSocket 都被 403 拒掉 —— 界面看着是好的，只有
          # 实时推送死掉，而且报错只出现在浏览器 console 里。干净检出没有
          # data/config.json 时默认端口就是 17520，这里显式设一次，让"两边
          # 一致"不再依赖那个默认值。
          $env:LUNARSHROUD_LAUNCHER_PORT = '17520'
          $env:LUNARSHROUD_TEST_URL = 'http://127.0.0.1:17520'
          # tools/dev_backend.py, not a bare uvicorn: it points DATA_DIR at a temp
          # directory. The browser suite creates conversations and writes rows, and
          # those must never land in a real user data directory (AGENTS §6.7).
          $backend = Start-Process -FilePath python -ArgumentList 'tools/dev_backend.py' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              try {
                if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:17520/api/system/health').StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw 'Backend did not become ready for browser tests.' }
            Push-Location ui
            try {
              # Install the Chromium revision **the pinned @playwright/test expects**.
              # `npx playwright install` resolves the latest Playwright and downloads
              # a revision the locked one does not look for (measured: 1248 vs 1200),
              # so the gate could never start. Do not default to `channel: msedge`:
              # that requires the runner to ship Edge, and a runner image change then
              # shows up as "page did not render" rather than "no browser".
              npx playwright install chromium
              if ($LASTEXITCODE -ne 0) { throw 'playwright install failed.' }
              npx playwright test
              if ($LASTEXITCODE -ne 0) { throw 'Browser acceptance tests failed.' }
            } finally {
              Pop-Location
            }
          } finally {
            if ($backend -and -not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
          }
      - name: Build bundled Python backend
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean -y
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Rust formatting
        run: cargo +1.97.1 fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo +1.97.1 clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings -A linker-messages
      - name: Rust tests
        run: cargo +1.97.1 test --manifest-path src-tauri/Cargo.toml --locked
