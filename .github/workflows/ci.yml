name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Release mirror gate
        # 公开镜像 github/ 与工作树必须逐字节一致，且不得携带本机痕迹。
        # 这条门禁此前只能手工跑：镜像漂移与隐私泄露都不会被 CI 发现（审计已实证，
        # 仓库根目录的 .lnk 就是这样进到"可发布"名单里的）。纯标准库，无依赖，
        # 所以放在安装依赖之前，最快失败。
        # 公开仓库本身没有 github/ 子目录（它就是镜像），此时脚本无事可比；
        # 用 if 跳过，而不是在 Actions 里展示一个永远绿的空步骤。
        if: hashFiles('github/**') != ''
        run: python -X utf8 tools/check_release_mirror.py
      - name: Install Python dependencies
        # 哈希锁安装（审计 F21）：requirements-dev.lock 钉住完整闭包并对每个
        # 产物给出 sha256（cp311 本地 / cp312 CI 两套 win_amd64 wheel）；哈希已
        # 对 PyPI 官方 JSON 摘要交叉验证。保险库文件的重新生成说明见其头注释。
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Lint backend and tools (ruff)
        # tools/ 一并 lint：它们也随镜像发布，此前只 lint backend 会让工具脚本的
        # 问题（18 处）长期不进 CI，而 docs/STATUS.md 的 "lint clean" 容易被读成
        # 全仓干净。公开镜像 github/ 不必单独 lint —— 镜像门禁已强制它与工作树
        # 逐字节一致，working tree 侧过了就等于过了。
        run: python -m ruff check backend tools
      - name: Backend tests and product-code coverage
        run: python -m pytest --cov=backend --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=75
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'
      - name: Frontend unit tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem frontend/tests -File -Filter '*.test.mjs')
          if ($tests.Count -eq 0) { throw 'No frontend test files found; refusing a false-green check.' }
          node --test $tests.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Ran $($tests.Count) frontend test file(s)."
      - name: Frontend syntax check
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem frontend/js -File | Where-Object Extension -in '.js', '.mjs')
          if ($scripts.Count -eq 0) { throw 'No JavaScript files found; refusing a false-green check.' }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Checked $($scripts.Count) JavaScript files."
      - name: Browser core-path, accessibility and performance gate
        shell: pwsh
        run: |
          $env:LUNARSHROUD_ALLOW_INSECURE_DEV = '1'
          $backend = Start-Process -FilePath python -ArgumentList '-m', 'uvicorn', 'main:app', '--host', '127.0.0.1', '--port', '17520', '--log-level', 'warning' -WorkingDirectory backend -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:17520/api/system/health').StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw 'Backend did not become ready for browser tests.' }
            # The Node test package lives at the repository root: `frontend/` is
            # Tauri's frontendDist, and embedding node_modules into the shell is
            # both a build error and needless payload.
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw 'Browser acceptance tests failed.' }
          } finally {
            if ($backend -and -not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
          }
      - name: Build bundled Python backend
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean -y
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Rust formatting
        run: cargo +1.97.1 fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo +1.97.1 clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings -A linker-messages
      - name: Rust tests
        run: cargo +1.97.1 test --manifest-path src-tauri/Cargo.toml --locked
