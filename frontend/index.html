<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LunarShroud — llama.cpp 桌面启动器：模型库、参数编辑、实例生命周期、日志与资源监控。" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>LunarShroud</title>
  <!-- 显式声明图标：否则浏览器会请求 /favicon.ico，在 SPA 静态资源 404
       规则下表现为一条 console 错误。 -->
  <link rel="icon" href="/assets/logo.png?v=2" />
  <link rel="stylesheet" href="/css/tokens.css?v=1" />
  <link rel="stylesheet" href="/css/style.css?v=1" />
</head>
<body class="theme-dark">
  <!-- 首帧前应用保存的主题（浅色用户不应先看到一帧深色） -->
  <script src="/js/theme-boot.js?v=1"></script>
  <div class="app-layout">
    <!-- 顶部导航栏 -->
    <header class="app-header">
      <button id="btn-sidebar-toggle" class="sidebar-toggle" title="" aria-label="">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">
        <img class="logo" src="/assets/logo.png?v=2" alt="LunarShroud logo" />
        <span class="brand-text">LunarShroud</span>
      </div>
      <div class="header-spacer"></div>
      <!-- 居中：模型选择器（Ctrl+L）。文案由 app.js 注入，避免静态 HTML 里出现
           未翻译的中文。窄屏下整块隐藏（快捷键仍可用） -->
      <div class="header-center">
        <button id="btn-model-picker" class="btn btn-secondary btn-sm model-picker-btn"></button>
      </div>
      <!-- 当前运行实例状态指示器 -->
      <div class="header-status" id="header-status">
        <span class="status-dot" id="header-status-dot"></span>
        <span id="header-status-text"></span>
      </div>
      <div class="header-actions">
        <button id="btn-panel-toggle" class="btn btn-ghost btn-icon" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <button id="btn-lang" class="btn btn-ghost btn-icon btn-labelled" title="Language / 语言">EN</button>
        <button id="btn-theme" class="btn btn-ghost btn-icon btn-labelled" title="Theme / 主题">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="btn-about" class="btn btn-ghost btn-icon btn-labelled" title="About / 关于">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- 一级：图标轨道。宽度固定，hover 不再改变宽度（旧版会从 60px 撑到 220px，
           把主内容整页推动，这是 P2 要修的第一处抖动） -->
      <nav class="sidebar" id="sidebar">
        <!-- 由 app.js 动态渲染 -->
      </nav>

      <!-- 二级：上下文面板。内容由当前页面模块的 renderPanel() 提供，
           没有面板的页面整列隐藏，主内容自动占满 -->
      <aside class="context-panel" id="context-panel" hidden>
        <div class="context-panel-head">
          <span class="context-panel-title" id="context-panel-title"></span>
          <button id="btn-panel-collapse" class="btn btn-ghost btn-icon" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
        <div class="context-panel-body" id="context-panel-body">
          <!-- 由页面模块注入 -->
        </div>
      </aside>

      <!-- 主内容区 -->
      <div class="backend-banner" id="backend-banner" role="status" hidden></div>
      <main class="main-content" id="main-content">
        <!-- 页面由 app.js 动态注入 -->
      </main>
    </div>
  </div>

  <!-- 窄屏侧边栏遮罩 -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- 全局 Toast 容器 -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- 主应用脚本（ES Module） -->
  <script type="module" src="/js/app.js?v=1"></script>
</body>
</html>
