<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LunarShroud — local AI chat and agent workbench for Windows. Bring your own llama.cpp build, no account, no network, everything stays on this machine."
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>LunarShroud</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <!--
      Theme is applied before first paint by a tiny inline-free classic script.
      It must be a separate file served from the same origin: the app's CSP is
      `script-src 'self'`, and an inline script would force 'unsafe-inline' on the
      strictest directive in the policy.
    -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
